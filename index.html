<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validoon — 2026 Strategic Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">V</div>
        <div class="brand-text">
          <div class="brand-name">Validoon</div>
          <div class="brand-sub">Local 2026 Threat Intel — AI & Cloud Protection</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-pill" id="btnLoadA">Load Test A</button>
        <button class="btn btn-primary btn-pill" id="btnScan">Execute Scan</button>
        <button class="btn btn-danger btn-pill" id="btnClear">Clear</button>
      </div>
    </div>

    <div class="grid">
      <div class="card card-lg">
        <div class="h-title">Input Stream</div>
        <textarea id="input" class="textarea" placeholder="Paste payloads here..."></textarea>
        <div class="footer-note" id="buildStamp">Build: v1.2.2 FINAL</div>
      </div>

      <div class="card card-lg">
        <div id="verdictBox" class="verdict verdict-secure">
          <div class="verdict-title" id="verdictText">READY</div>
          <div class="stats" style="display:flex; gap:15px; margin-top:10px;">
            <div>Scans: <span id="kScans">0</span></div>
            <div style="color:#ff5b5b">Block: <span id="kBlock">0</span></div>
          </div>
        </div>
        <div class="signals" style="margin-top:15px;">
          <strong>Active Signals:</strong>
          <div id="signals" class="chips"></div>
        </div>
      </div>

      <div class="card card-xl">
        <div class="table">
          <div class="thead" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; font-weight: bold; padding: 10px; border-bottom: 1px solid #333;">
            <div>Input Content</div>
            <div>Decision</div>
            <div>Sev</div>
            <div>Entropy</div>
          </div>
          <div id="rows"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app_prod.js"></script>
</body>
</html>
